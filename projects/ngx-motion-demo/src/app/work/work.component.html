
<div
  motionone
  [initial]="{
    opacity: 0,
    backgroundColor: 'blue'
  }"
  [animate]="{
    opacity: 1,
    backgroundColor: 'aqua',
    transition: {
      duration: .2,
      ease: 'ease-in'
    }
  }"
  [exit]="{
    opacity: 0,
    backgroundColor: 'red',
    transition: {
      duration: 0.3,
      ease: 'ease-in'
    }
  }"
  class=" w-full h-full grid grid-cols-3 grid-rows-3 gap-4"
>
  <h1 class="text-white text-3xl">WWWWORK</h1>
</div>
