<div
  motionone
  [initial]="{
    opacity: 0,
    y: 100,
    backgroundColor: 'yelluw'
  }"
  [animate]="{
    opacity: 1,
    y: 0,
    backgroundColor: 'green',
  }"
  [exit]="{
    opacity: 0,
    scale: 1.2,
    y: 100,
    backgroundColor: 'red',
    transition: {
      duration: 3,
      ease: 'ease-in'
    }
  }"
  class="w-full h-full grid grid-cols-3 grid-rows-3 gap-4"
>
  <h1 class="text-white text-3xl">Work</h1>
</div>
